<div class="container mt-5">
    <form [formGroup]="uploadForm" (ngSubmit)="upload()" enctype="multipart/form-data">
      <div class="mb-3">
        <label>UID</label>
        <input type="text" class="form-control" formControlName="uid" required>
      </div>
  
      <div class="mb-3">
        <label>Grade</label>
        <input type="text" class="form-control" formControlName="grade" required>
      </div>
  
      <div class="mb-3">
        <label>Upload Marksheet (PDF)</label>
        <input type="file" class="form-control" (change)="onFileChange($event)" accept=".pdf" required>
      </div>
  
      <button class="btn btn-success">Upload</button>
    </form>
  
    <div *ngIf="success" class="alert alert-success mt-3">Uploaded successfully!</div>
    <div *ngIf="error" class="alert alert-danger mt-3">Upload failed.</div>
  </div>
