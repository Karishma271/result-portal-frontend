<div class="container mt-5">
    <!-- School Header -->
    <div class="text-center mb-4">
      <img src="assets/logo.png" alt="logo" width="90" height="90" class="mb-2">
      <h2 class="fw-bold">શ્રી કુંજડ પ્રાથમિક શાળા</h2>
      <p class="text-muted">કુંજડ ગામ, તા. મહુવા, જિ. સુરત</p>
    </div>
  
    <!-- Search Form -->
    <div class="card shadow-sm p-4 mx-auto" style="max-width: 480px;">
      <h5 class="mb-3 text-center fw-semibold">Student Result</h5>
  
      <form [formGroup]="resultForm" (ngSubmit)="viewResult()">
        <div class="mb-3">
          <label for="grade" class="form-label">Standard (Grade)</label>
          <select class="form-select" id="grade" formControlName="grade">
            <option value="">-- Select Grade --</option>
            <option *ngFor="let g of grades" [value]="g">Std {{ g }}</option>
          </select>
        </div>
  
        <div class="mb-3">
          <label for="uid" class="form-label">Student UID</label>
          <input type="text" id="uid" formControlName="uid" class="form-control" placeholder="Enter UID">
        </div>
  
        <button class="btn btn-primary w-100" [disabled]="resultForm.invalid">View Result</button>
      </form>
  
      <!-- PDF Download -->
      <div *ngIf="pdfUrl" class="alert alert-success mt-3 text-center">
        <p class="mb-1">Result found for UID {{ resultForm.value.uid }}</p>
        <a [href]="pdfUrl" class="btn btn-outline-success" target="_blank">Download Marksheet</a>
      </div>
  
      <!-- Error -->
      <div *ngIf="error" class="alert alert-danger mt-3 text-center">
        {{ error }}
      </div>
    </div>
  
    <!-- Footer -->
    <footer class="text-center mt-5 text-muted">
      Developed by Karishma Patel
    </footer>
  </div>
