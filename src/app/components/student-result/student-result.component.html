<div class="container mt-4">
  <form [formGroup]="resultForm" (ngSubmit)="viewResult()">
    <div class="mb-3">
      <label for="grade" class="form-label">Select Grade</label>
      <select id="grade" class="form-select" formControlName="grade" required>
        <option value="" disabled selected>Select Grade</option>
        <option *ngFor="let g of grades" [value]="g">{{ g }}</option>
      </select>
    </div>

    <div class="mb-3">
      <label for="uid" class="form-label">Enter UID</label>
      <input id="uid" type="text" class="form-control" formControlName="uid" required>
    </div>

    <button type="submit" class="btn btn-primary">View Result</button>
  </form>

  <div *ngIf="pdfUrl" class="mt-4">
    <iframe [src]="pdfUrl | safeUrl" width="100%" height="600px"></iframe>
    <a [href]="pdfUrl" class="btn btn-success mt-2" download>Download</a>
  </div>

  <div *ngIf="notFound" class="alert alert-danger mt-3">Student not found.</div>
</div>
